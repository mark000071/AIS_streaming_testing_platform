[project]
name = "envship-core"
version = "0.1.0"
description = "Platform services: ingest, replay, tracker, reconcile, jobs, api"
requires-python = ">=3.11"
dependencies = [
    "envship-contracts",
    "envship-sdk",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.1",
    "redis>=5",
    "msgpack>=1.0",
    "pydantic-settings[yaml]>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "pysocks>=1.7",
]

[project.scripts]
envship = "envship_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envship_core"]
