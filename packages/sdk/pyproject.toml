[project]
name = "envship-sdk"
version = "0.1.0"
description = "Predictor SDK: Protocol, run_predictor() container runner, in-process replay adapter"
requires-python = ">=3.11"
dependencies = [
    "envship-contracts",
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envship_sdk"]
