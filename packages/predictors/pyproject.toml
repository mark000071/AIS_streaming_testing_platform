[project]
name = "envship-predictors"
version = "0.1.0"
description = "Built-in baseline predictors: constant velocity, Kalman, IMM"
requires-python = ">=3.11"
dependencies = [
    "envship-sdk",
    "numpy>=1.26",
]

[project.scripts]
envship-predictor = "envship_predictors.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envship_predictors"]
